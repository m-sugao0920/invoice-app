<!-- MS請求書システム 基礎整理版 2026-08-27 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS請求書作成システム</title>
<link rel="stylesheet" href="invoice_style.css">


<style id="ms4-month-dashboard-style">
.ms4-month-dashboard{
  padding-top:12px !important;
  padding-bottom:12px !important;
}
.ms4-dashboard-title{
  margin:0 0 7px;
  font-size:12px;
  font-weight:900;
  color:#355f78;
}
.ms4-month-dashboard .ms4-current-grid > div{
  min-height:54px;
}
.ms4-month-dashboard .ms4-label{
  font-size:10px;
}
.ms4-month-dashboard .ms4-value{
  margin-top:3px;
}
</style>


<style id="ms4-site-list-compact-view-only">
/* メイン画面の工事一覧は確認専用：操作ボタンを表示せず、1工事1行でコンパクトにする */
#ms4SiteList .ms4-site-actions,
#ms4SiteList .site-actions,
#ms4SiteList .actions,
#ms4SiteList button{
  display:inline-flex !important;
}
#ms4SiteList .ms4-open{
  display:none !important;
}
#ms4SiteList > *{
  min-height:0 !important;
  padding-top:7px !important;
  padding-bottom:7px !important;
  margin-top:0 !important;
  margin-bottom:4px !important;
}
#ms4SiteList .ms4-site-card,
#ms4SiteList .site-card,
#ms4SiteList .ms4-site-info,
#ms4SiteList .site-info{
  display:flex !important;
  flex-direction:row !important;
  align-items:center !important;
  flex-wrap:nowrap !important;
  gap:10px !important;
}
#ms4SiteList p,
#ms4SiteList .sub,
#ms4SiteList .note{
  margin:0 !important;
}
</style>


<style id="ms4-site-list-one-line-final">
/* メイン画面の工事一覧：1工事1行でコンパクトに表示 */
#ms4SiteList > *{
  min-height:0 !important;
  padding:6px 9px !important;
  margin:0 0 4px !important;
}
#ms4SiteList .ms4-site-item{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) auto !important;
  align-items:center !important;
  gap:8px !important;
}
#ms4SiteList .ms4-site-info,
#ms4SiteList .site-info,
#ms4SiteList .ms4-site-card{
  min-width:0 !important;
}
#ms4SiteList .ms4-site-name,
#ms4SiteList .ms4-site-meta,
#ms4SiteList .ms4-site-amt{
  display:inline !important;
  margin:0 !important;
  white-space:nowrap !important;
}
#ms4SiteList .ms4-site-name{
  margin-right:12px !important;
}
#ms4SiteList .ms4-site-meta{
  font-size:10px !important;
}
#ms4SiteList br{
  display:none !important;
}
</style>


<style id="ms4-site-list-font-larger-final">
#ms4SiteList .ms4-site-name{
  font-size:14px !important;
  font-weight:700 !important;
}
#ms4SiteList .ms4-site-meta,
#ms4SiteList .ms4-site-amt{
  font-size:12px !important;
}
#ms4SiteList button{
  font-size:12px !important;
}
</style>


<style id="ms4-site-list-responsive-height-final">
/* 工事一覧は画面の縦サイズに応じて自動調整。
   小さい画面では抑え、大きい画面では広く表示する。 */
#ms4SiteList{
  max-height:clamp(320px, 52vh, 580px) !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
}

/* 縦が低いノートPC等 */
@media (max-height:760px){
  #ms4SiteList{
    max-height:360px !important;
  }
}

/* 標準的なフルHD前後 */
@media (min-height:900px){
  #ms4SiteList{
    max-height:520px !important;
  }
}

/* 縦に余裕のある大きなモニター */
@media (min-height:1100px){
  #ms4SiteList{
    max-height:580px !important;
  }
}
</style>


<style id="ms4-billing-month-direct-style">
.ms4-billing-month-bar{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0 0 10px;
  padding:7px 9px;
  border:1px solid #d5e6f7;
  border-radius:9px;
  background:#fbfdff;
  font-family:var(--fontNum);
}
.ms4-billing-month-bar label{
  font-size:12px;
  font-weight:900;
  color:#355f78;
  white-space:nowrap;
}
#ms4BillingMonth{
  width:145px;
  min-height:32px;
  padding:3px 7px;
  border:1px solid #afc7d8;
  border-radius:7px;
  background:#fff;
  color:#263f50;
  font-size:13px;
  font-weight:800;
}
.ms4-billing-month-bar span{
  font-size:10.5px;
  color:#6a7d89;
}
@media(max-width:700px){
  .ms4-billing-month-bar{flex-wrap:wrap}
}
</style>


<style id="ms4-site-claim-button-visible-final">
#ms4SiteList .ms4-site-buttons{
  display:flex !important;
  align-items:center !important;
  gap:6px !important;
}
#ms4SiteList .ms4-subbtn{
  display:inline-flex !important;
  align-items:center !important;
  justify-content:center !important;
  min-width:58px !important;
  width:auto !important;
  height:30px !important;
  padding:0 10px !important;
  font-size:12px !important;
  font-weight:900 !important;
  white-space:nowrap !important;
}
</style>


<style id="ms4-billing-month-today-button-style">
#ms4BillingMonthToday{
  width:auto !important;
  min-width:86px !important;
  height:32px !important;
  padding:0 10px !important;
  border:1px solid #9fb8c9 !important;
  border-radius:7px !important;
  background:#eef6fb !important;
  color:#245b80 !important;
  font-size:11px !important;
  font-weight:900 !important;
  cursor:pointer !important;
  white-space:nowrap !important;
}
#ms4BillingMonthToday:hover{
  background:#e3f1f9 !important;
}
</style>


<!-- MS請求書システム 簡易パスワード保護（SHA-256 / セッション中のみ認証保持） -->
<style id="ms-password-gate-style">
html.ms-password-locked body > *:not(#msPasswordGate){visibility:hidden!important;}
#msPasswordGate{
  position:fixed;inset:0;z-index:99999;
  display:none;align-items:center;justify-content:center;
  padding:20px;background:linear-gradient(135deg,#eaf4ff,#ffffff);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic","Meiryo",sans-serif;
  visibility:visible!important;
}
html.ms-password-locked #msPasswordGate{display:flex;}
.ms-login-box{
  width:min(680px,100%);background:#fff;border:1px solid #cfe3f7;
  border-radius:18px;box-shadow:0 24px 60px rgba(0,64,128,.20);
  padding:26px;text-align:center;box-sizing:border-box;
}
.ms-login-title{font-size:25px;font-weight:950;color:#0647a5;margin-bottom:8px;}
.ms-login-sub{font-size:13px;color:#60758d;line-height:1.6;margin-bottom:16px;}
.ms-login-box input{
  width:100%;height:44px;border:1px solid #bad8f4;border-radius:10px;
  padding:8px 12px;font-size:16px;text-align:center;box-sizing:border-box;
  background:#fff;color:#122033;
}
.ms-login-box button{
  width:100%;height:42px;border:0;border-radius:10px;margin-top:10px;
  background:#0647a5;color:#fff;font-size:15px;font-weight:950;cursor:pointer;
}
.ms-login-error{min-height:20px;margin-top:9px;color:#b42318;font-size:12px;font-weight:800;}
</style>
<script id="ms-password-gate">
(function(){
  'use strict';
  var KEY='ms_invoice_auth_v1';
  var HASH='60d523c99e38a30e4b889688cf2563ae6b745aa77b41c3d5b7a7fa9606aaa4cf';
  try{ if(sessionStorage.getItem(KEY)==='ok') return; }catch(e){}
  document.documentElement.classList.add('ms-password-locked');

  function hex(buf){return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
  async function check(pw){
    if(!window.crypto || !window.crypto.subtle) return false;
    var data=new TextEncoder().encode(pw);
    return hex(await crypto.subtle.digest('SHA-256',data))===HASH;
  }
  function buildGate(){
    if(document.getElementById('msPasswordGate')) return;
    var gate=document.createElement('div');
    gate.id='msPasswordGate';
    gate.innerHTML='<div class="ms-login-box">'+
      '<div class="ms-login-title">MS請求書システム</div>'+
      '<div class="ms-login-sub">パスワードを入力してください。</div>'+
      '<input autocomplete="current-password" id="msPasswordInput" placeholder="パスワード" type="password">'+
      '<button id="msPasswordLoginBtn" type="button">ログイン</button>'+
      '<div class="ms-login-error" id="msPasswordError"></div>'+
      '</div>';
    document.body.insertBefore(gate,document.body.firstChild);
    var input=document.getElementById('msPasswordInput');
    var button=document.getElementById('msPasswordLoginBtn');
    var error=document.getElementById('msPasswordError');
    async function login(){
      if(!input) return;
      if(await check(input.value)){
        if(error) error.textContent='';
        try{sessionStorage.setItem(KEY,'ok');}catch(e){}
        document.documentElement.classList.remove('ms-password-locked');
        gate.remove();
      }else{
        if(error) error.textContent='パスワードが違います。';
        input.select();
      }
    }
    button.addEventListener('click',login);
    input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();login();}});
    setTimeout(function(){input.focus();},50);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',buildGate,{once:true});
  else buildGate();
})();
</script>

<script id="ms4-month-dashboard-script">
(function(){
  "use strict";

  function selectedMonthKey(){
    const el=document.getElementById("ms4BillingMonth");
    const v=el?.value||"";
    if(/^\d{4}-\d{2}$/.test(v)) return v;
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  }

  function yenText(n){
    try{
      if(typeof yen==="function") return yen(Number(n||0))+" 円";
    }catch(e){}
    return Number(n||0).toLocaleString("ja-JP")+" 円";
  }

  function getMonthlyRec(month,siteId){
    try{
      return state?.monthly?.[month]?.[siteId] || null;
    }catch(e){
      return null;
    }
  }

  function monthsUntil(month){
    try{
      return Object.keys(state?.monthly||{}).filter(m=>m<=month).sort();
    }catch(e){
      return [];
    }
  }

  function actualForMonth(month,site){
    try{
      if(getMonthlyRec(month,site.id) && typeof calcBillForSite==="function"){
        return Math.max(0,Number(calcBillForSite(month,site)?.billNet||0));
      }
    }catch(e){}
    return 0;
  }

  function billedUntil(month,site){
    let total=0;
    for(const m of monthsUntil(month)){
      if(!getMonthlyRec(m,site.id)) continue;
      try{
        if(typeof calcBillForSite==="function"){
          total+=Math.max(0,Number(calcBillForSite(m,site)?.billNet||0));
        }
      }catch(e){}
    }
    return Math.round(total);
  }

  function workUntil(month,siteId){
    let total=0;
    for(const m of monthsUntil(month)){
      const rec=getMonthlyRec(m,siteId);
      if(rec) total+=Number(rec.thisMonthNet||0);
    }
    return Math.round(total);
  }

  function completedUntil(month,siteId){
    for(const m of monthsUntil(month)){
      const rec=getMonthlyRec(m,siteId);
      if(rec?.isFinal) return true;
    }
    return false;
  }

  function calcSiteAtMonth(site,month){
    try{
      const rec=getMonthlyRec(month,site.id);
      const isFinal=!!rec?.isFinal;
      if(typeof getSiteForCalc==="function"){
        return getSiteForCalc(site,isFinal,month);
      }
    }catch(e){}
    return site;
  }

  function orderAtMonth(site,month){
    const s=calcSiteAtMonth(site,month);
    return Math.max(0,Math.round(
      Number(s?.contractNet||0)+
      Number(s?.increaseNet||0)-
      Number(s?.reductionNet||0)
    ));
  }

  function pendingAtMonth(site,month){
    const order=orderAtMonth(site,month);
    const billed=billedUntil(month,site);
    return Math.max(0,order-billed)>0;
  }

  function retentionWaitingAtMonth(site,month){
    try{
      const s=calcSiteAtMonth(site,month);
      const cap=Math.max(0,Number(typeof retentionCap==="function" ? retentionCap(s) : 0));
      if(cap<=0) return false;

      const order=orderAtMonth(site,month);
      const billed=billedUntil(month,site);
      const work=workUntil(month,site.id);
      const completed=completedUntil(month,site.id);

      let trigger=Number.POSITIVE_INFINITY;
      if(typeof triggerLine==="function") trigger=Number(triggerLine(s));

      // 対象月終了時点で保留金が残っている工事だけを表示。
      const retentionReached =
        completed ||
        (Number.isFinite(trigger) && work>=Math.round(trigger));

      return retentionReached && billed<order && (order-billed)>0;
    }catch(e){
      return false;
    }
  }

  function refreshDashboard(){
    if(typeof state==="undefined" || !Array.isArray(state.sites)) return;

    const month=selectedMonthKey();
    let actual=0;
    let pending=0;
    let retention=0;

    state.sites.forEach(site=>{
      actual += actualForMonth(month,site);
      if(pendingAtMonth(site,month)) pending++;
      if(retentionWaitingAtMonth(site,month)) retention++;
    });

    const a=document.getElementById("ms4MonthActual");
    const p=document.getElementById("ms4MonthPending");
    const r=document.getElementById("ms4MonthRetention");
    if(a) a.textContent=yenText(actual);
    if(p) p.textContent=pending+"件";
    if(r) r.textContent=retention+"件";
  }

  document.addEventListener("DOMContentLoaded",()=>{
    setTimeout(refreshDashboard,180);
    setTimeout(refreshDashboard,500);

    const month=document.getElementById("ms4BillingMonth");
    if(month){
      month.addEventListener("change",()=>setTimeout(refreshDashboard,0));
    }
  });

  document.addEventListener("click",()=>setTimeout(refreshDashboard,180));
  window.addEventListener("focus",()=>setTimeout(refreshDashboard,80));
})();
</script>


<script id="ms4-billing-month-direct-script">
(function(){
  "use strict";
  const KEY="ms_invoice_billing_month_direct_v1";

  function pcMonth(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  }
  function selectedMonth(){
    const el=document.getElementById("ms4BillingMonth");
    const v=el?.value||"";
    return /^\d{4}-\d{2}$/.test(v) ? v : pcMonth();
  }
  function init(){
    const el=document.getElementById("ms4BillingMonth");
    if(!el) return;
    let saved="";
    try{ saved=localStorage.getItem(KEY)||""; }catch(e){}
    el.value=/^\d{4}-\d{2}$/.test(saved) ? saved : pcMonth();
    el.addEventListener("change",()=>{
      if(/^\d{4}-\d{2}$/.test(el.value)){
        try{ localStorage.setItem(KEY,el.value); }catch(e){}
      }
    });

    const todayBtn=document.getElementById("ms4BillingMonthToday");
    if(todayBtn){
      todayBtn.addEventListener("click",()=>{
        const now=pcMonth();
        el.value=now;
        try{ localStorage.setItem(KEY,now); }catch(e){}
        el.dispatchEvent(new Event("change",{bubbles:true}));
      });
    }
  }

  window.MSInvoiceOpenMonthlyWithMonth=function(siteId){
    const month=selectedMonth();
    try{ localStorage.setItem(KEY,month); }catch(e){}

    const p=new URLSearchParams();
    p.set("month",month);
    if(siteId) p.set("site",siteId);

    location.href="invoice_monthly.html?"+p.toString();
  };

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",init,{once:true});
  }else{
    init();
  }
})();
</script>
