<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個人請求書｜印刷</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#e9edf0;color:#222;font-family:"Yu Gothic UI","Yu Gothic","Meiryo",sans-serif}.toolbar{width:210mm;margin:14px auto 8px;display:flex;justify-content:space-between;gap:8px}.toolbar button{border:1px solid #9ca9b0;background:#fff;border-radius:7px;padding:8px 14px;font-weight:700;cursor:pointer}.toolbar .print{background:#4f8db8;color:#fff;border-color:#4f8db8}.sheet{width:210mm;min-height:297mm;margin:0 auto 18px;background:#fff;padding:25mm 24mm 22mm;box-shadow:0 2px 12px rgba(0,0,0,.12)}.topline{height:4px;background:#263f50;margin-bottom:13mm}.title{text-align:center;font-size:25px;letter-spacing:.35em;font-weight:500;margin:0 0 14mm}.topgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:15mm;align-items:start}.customer-name{font-size:18px;font-weight:600;border-bottom:1.5px solid #333;padding-bottom:4px;margin-bottom:7px}.customer-address{font-size:11px;line-height:1.75}.meta{font-size:10.5px;line-height:1.8}.meta .company{font-size:14px;font-weight:700;margin-top:8px}.project{margin-top:11mm;padding:7px 0;border-top:1px solid #b8b8b8;border-bottom:1px solid #b8b8b8;font-size:11.5px}.project b{font-size:13px}.amount-box{margin:13mm 0 11mm;display:flex;align-items:baseline;justify-content:flex-start;gap:8mm;border-bottom:3px solid #263f50;padding:0 0 6mm}.amount-box .label{font-size:13px;letter-spacing:.08em}.amount-box .amount{font-size:29px;font-weight:650;letter-spacing:.03em}.section-title{font-size:11px;font-weight:700;letter-spacing:.12em;margin:0 0 5px}.details{width:100%;border-collapse:collapse;font-size:11.5px}.details th{font-size:10px;font-weight:600;text-align:left;border-top:1.5px solid #444;border-bottom:1px solid #aaa;padding:7px 8px}.details th:last-child,.details td:last-child{text-align:right}.details td{padding:9px 8px;border-bottom:1px solid #ddd}.details .total td{border-top:1.5px solid #555;border-bottom:2px solid #444;font-weight:700;font-size:12.5px}.summary{width:62%;margin:11mm 0 0 auto;border-collapse:collapse;font-size:10.5px}.summary td{padding:5px 3px;border-bottom:1px solid #ddd}.summary td:last-child{text-align:right;font-size:11.5px}.summary .current td{font-weight:700;border-top:1.5px solid #555;border-bottom:1.5px solid #555}.footer{margin-top:17mm;display:grid;grid-template-columns:1fr 1fr;gap:15mm;border-top:1px solid #aaa;padding-top:8mm}.footer h3{font-size:10.5px;margin:0 0 5px;letter-spacing:.08em}.footer p{font-size:10px;line-height:1.7;margin:0}.bottomline{height:2px;background:#263f50;margin-top:12mm}.error{width:210mm;margin:30px auto;background:#fff;padding:25px;border:1px solid #d8dde0;border-radius:8px}.hidden{display:none}
.patterns{display:flex;gap:6px;align-items:center}.patterns button{min-width:112px}.patterns button.active{color:#fff;border-color:#426f91;background:#5d91b7}.pattern-label{font-size:11px;color:#52616b;margin-right:2px}
/* B pattern: standard, formal */
body.pattern-b .sheet{padding:20mm 19mm 20mm}body.pattern-b .topline{height:7px;background:#526f86;margin-bottom:8mm}body.pattern-b .title{text-align:left;font-size:24px;letter-spacing:.2em;margin:0 0 9mm;border-bottom:2px solid #526f86;padding-bottom:5mm}body.pattern-b .topgrid{gap:9mm}body.pattern-b .customer-name{font-size:17px;border-bottom:1px solid #777}body.pattern-b .project{margin-top:8mm;background:#f4f7f9;border:1px solid #aab7c0;padding:8px 10px}body.pattern-b .amount-box{margin:8mm 0 8mm;background:#eef3f6;border:1px solid #9dabb4;border-left:7px solid #526f86;padding:7mm 8mm;gap:10mm}body.pattern-b .amount-box .amount{font-size:27px}body.pattern-b .details{border-top:2px solid #526f86}body.pattern-b .details th{background:#f0f3f5;border-top:0}body.pattern-b .details td{border-bottom:1px solid #cbd2d6}body.pattern-b .details .total td{background:#f7f8f9;border-bottom:2px solid #526f86}body.pattern-b .summary{width:66%;border-top:1px solid #9aa8b0}body.pattern-b .footer{margin-top:13mm;border-top:2px solid #526f86}body.pattern-b .bottomline{display:none}
/* C pattern: 法人版Dパターンを基調にした個人向け */
body.pattern-c .sheet{padding:23mm 25mm 18mm}
body.pattern-c .topline{height:0;margin:0}
body.pattern-c .title{text-align:left;font-size:25px;font-weight:700;letter-spacing:.08em;margin:0 0 5mm;padding:0 0 4mm;border-bottom:3px solid #0b3e73;color:#111}
body.pattern-c .topgrid{grid-template-columns:1.18fr .82fr;gap:13mm;margin-top:8mm}
body.pattern-c .customer-name{font-size:18px;font-weight:700;border-bottom:1px solid #0b3e73;padding-bottom:4mm;margin-bottom:3mm}
body.pattern-c .customer-address{font-size:10.5px}
body.pattern-c .meta{font-size:10px;line-height:1.75;text-align:left}
body.pattern-c .meta .company{font-size:14px;font-weight:700;color:#0b3e73;margin-top:5mm}
body.pattern-c .project{margin-top:9mm;padding:5mm 4mm;border:0;background:#eef4fa;border-left:4px solid #0b3e73;font-size:11px}
body.pattern-c .project b{font-size:13px}
body.pattern-c .amount-box{margin:8mm 0 9mm;padding:6mm 5mm;background:#0b3e73;border:0;display:flex;justify-content:space-between;align-items:center;gap:8mm;color:#fff}
body.pattern-c .amount-box .label{font-size:12px;font-weight:700;letter-spacing:.05em}
body.pattern-c .amount-box .amount{font-size:28px;font-weight:700;color:#fff}
body.pattern-c .section-title{margin:0;padding:3mm 4mm;background:#0b3e73;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em}
body.pattern-c .details{border-collapse:collapse}
body.pattern-c .details th{background:#eef4fa;border-top:0;border-bottom:1px solid #b9cce0;padding:7px 8px;color:#333}
body.pattern-c .details td{padding:8px;border-bottom:1px solid #b9cce0}
body.pattern-c .details .total td{background:#f3f6f8;border-top:0;border-bottom:2px solid #0b3e73;font-weight:700;font-size:12px}
body.pattern-c .summary{width:100%;margin:8mm 0 0;border-collapse:collapse}
body.pattern-c .summary td{padding:5px 8px;border-bottom:1px solid #b9cce0}
body.pattern-c .summary td:first-child{width:58%;background:#f8fafc}
body.pattern-c .summary td:last-child{text-align:right;font-size:11.5px}
body.pattern-c .summary .current td{background:#eef4fa;border-top:1px solid #0b3e73;border-bottom:1px solid #0b3e73;font-weight:700}
body.pattern-c .footer{margin-top:11mm;padding-top:6mm;border-top:2px solid #0b3e73;gap:13mm}
body.pattern-c .footer h3{color:#0b3e73;font-weight:700}
body.pattern-c .bottomline{width:30mm;height:4px;background:#0b3e73;margin-top:10mm}
@page{size:A4 portrait;margin:0}@media print{html,body{background:#fff}.toolbar,.error{display:none!important}.sheet{margin:0;box-shadow:none;width:210mm;min-height:297mm;page-break-after:avoid}}
</style></head><body>
<div class="toolbar"><button onclick="window.close()">← 戻る</button><div class="patterns"><span class="pattern-label">印刷パターン</span><button id="patA" onclick="setPattern('a')">Aパターン</button><button id="patB" onclick="setPattern('b')">Bパターン</button><button id="patC" onclick="setPattern('c')">Cパターン</button></div><button class="print" onclick="window.print()">印刷</button></div><div id="error" class="error hidden"></div>
<main class="sheet" id="sheet"><div class="topline"></div><h1 class="title">請 求 書</h1><div class="topgrid"><section><div class="customer-name" id="customer"></div><div class="customer-address" id="address"></div></section><section class="meta"><div id="date"></div><div class="company" id="company"></div><div id="companyAddress"></div><div id="companyTel"></div></section></div><div class="project" id="project"></div><div class="amount-box"><span class="label">ご請求金額</span><span class="amount" id="amount"></span></div><section><div class="section-title">請 求 明 細</div><table class="details"><thead><tr><th>請求内容</th><th>金額</th></tr></thead><tbody id="details"></tbody></table></section><table class="summary"><tr><td>最終工事金額</td><td id="final"></td></tr><tr><td>前回までのご請求額</td><td id="before"></td></tr><tr class="current"><td>今回ご請求額</td><td id="current"></td></tr><tr><td>ご請求後残額</td><td id="remain"></td></tr></table><div class="footer"><section><h3>お振込先</h3><p id="bank"></p></section><section><h3>備考</h3><p id="note"></p></section></div><div class="bottomline"></div></main>
<script src="invoice_storage.js"></script><script>
function setPattern(p){if(p==='simple')p='a';if(p==='d')p='c';document.body.classList.remove('pattern-b','pattern-c');if(p==='b')document.body.classList.add('pattern-b');if(p==='c')document.body.classList.add('pattern-c');localStorage.setItem('ms_personal_invoice_print_pattern',p);['A','B','C'].forEach(x=>{const e=document.getElementById('pat'+x);if(e)e.classList.remove('active')});const id=p==='b'?'patB':p==='c'?'patC':'patA';const b=document.getElementById(id);if(b)b.classList.add('active')}
setPattern(localStorage.getItem('ms_personal_invoice_print_pattern')||'a');
(async()=>{'use strict';const KEY='ms_invoice_personal_v1',CK='ms_invoice_company_master_v1';const $=id=>document.getElementById(id),n=v=>Number(String(v||'0').replace(/,/g,''))||0,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),yen=v=>'¥'+Math.round(n(v)).toLocaleString('ja-JP');function jpdate(s){if(!s)return'';const [y,m,d]=s.split('-');return y+'年'+Number(m)+'月'+Number(d)+'日'}function fail(msg){$('sheet').classList.add('hidden');$('error').textContent=msg;$('error').classList.remove('hidden')}
await MSInvoiceStorage.ready;let data={projects:[]};try{data=JSON.parse((await MSInvoiceStorage.get(KEY))||'{}')}catch(e){}const q=new URLSearchParams(location.search),pid=q.get('project'),cid=q.get('claim'),p=(data.projects||[]).find(x=>x.id===pid),c=p&&(p.claims||[]).find(x=>x.id===cid);if(!p||!c){fail('印刷する請求データが見つかりません。個人請求画面からもう一度「印刷」を押してください。');return}const idx=(p.claims||[]).findIndex(x=>x.id===c.id),beforeFallback=(p.claims||[]).slice(0,Math.max(0,idx)).reduce((a,x)=>a+n(x.amount),0),snap=c.snapshot||{},finalAmount=snap.finalAmount!=null?n(snap.finalAmount):n(p.contract)+n(p.increase)-n(p.reduction),before=snap.claimedBefore!=null?n(snap.claimedBefore):beforeFallback,remain=snap.remainAfter!=null?n(snap.remainAfter):finalAmount-before-n(c.amount),customer=snap.customer||p.customer||'',zip=snap.zip||p.zip||'',address=snap.address||p.address||'',project=snap.project||p.project||'',site=snap.site||p.site||'';
$('customer').textContent=customer+' 様';$('address').innerHTML=(zip?'〒'+esc(zip)+'<br>':'')+esc(address);$('date').textContent='請求日　'+jpdate(c.date);$('project').innerHTML='<b>'+esc(project)+'</b>'+(site?'<br>工事場所：'+esc(site):'');$('amount').textContent=yen(c.amount);$('final').textContent=yen(finalAmount);$('before').textContent=yen(before);$('current').textContent=yen(c.amount);$('remain').textContent=yen(remain);
let details=(c.details||[]).filter(d=>String(d.text||'').trim()||n(d.amount));if(!details.length){let label=c.type==='中間金'?((c.midNo||1)+'回目中間金'):(c.type||'今回請求');details=[{text:(project?project+'　':'')+label,amount:c.amount}]}$('details').innerHTML=details.map(d=>'<tr><td>'+esc(d.text||'')+'</td><td>'+yen(d.amount)+'</td></tr>').join('')+'<tr class="total"><td>今回ご請求額</td><td>'+yen(c.amount)+'</td></tr>';
let co=null;try{co=JSON.parse((await MSInvoiceStorage.get(CK))||localStorage.getItem(CK)||'null')}catch(e){try{co=JSON.parse(localStorage.getItem(CK)||'null')}catch(_){}}co=co||{};$('company').textContent=co.name||'MSランドスケープ';$('companyAddress').innerHTML=(co.zip?'〒'+esc(co.zip)+'　':'')+esc(co.address||'');$('companyTel').textContent=co.tel?'TEL '+co.tel:'';const bank=[co.bank,co.branch,co.accountType,co.accountNo,co.accountName].filter(Boolean);$('bank').innerHTML=bank.length?bank.map(esc).join('<br>'):'自社情報の「振込先」を登録してください。';$('note').textContent=c.note||'恐れ入りますが、お振込手数料はお客様にてご負担くださいますようお願いいたします。';})();
</script></body></html>
